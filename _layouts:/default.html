<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f5; --panel:#ffffff;
    --ink:#1c1b19; --text:#232220; --text2:#5a564d; --text3:#6f6a5f;
    --muted:#9a958a; --accent:#b07a18; --accent-strong:#9a6a14; --line:#e9e5da;
    --sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* nav — matches the site's pl-nav */
  .pl-nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.93);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;padding:16px 40px}
  .pl-brand{font-weight:600;font-size:18px;letter-spacing:-0.01em;text-decoration:none;color:#232220;white-space:nowrap}
  .pl-navlinks{display:flex;gap:28px;font-size:15px;color:var(--text3)}
  .pl-navlinks a{text-decoration:none;color:var(--text3)}
  .pl-navlinks a:hover{color:var(--accent-strong)}
  .pl-navlinks a.current{color:var(--accent-strong);font-weight:500}

  .pl-wrap{max-width:880px;margin:0 auto;padding:0 40px}
  main{padding:56px 0 40px}

  .pl-eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:0.04em;color:var(--accent-strong);text-transform:uppercase}
  h1.pl-title{font-weight:600;font-size:44px;line-height:1.06;letter-spacing:-0.025em;color:var(--ink)}
  .pl-lede{font-size:19px;line-height:1.5;color:var(--text2);margin-top:16px;max-width:660px}

  /* blog index list */
  .pl-list{margin-top:34px}
  .post-item{display:flex;gap:16px;align-items:flex-start;padding:26px 0;border-bottom:1px solid var(--line)}
  .post-item:first-child{padding-top:4px}
  .post-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px}
  .post-date{font-family:var(--mono);font-size:12.5px;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase}
  .post-title{font-weight:600;font-size:22px;letter-spacing:-0.01em;margin-top:5px}
  .post-title a{text-decoration:none;color:var(--ink)}
  .post-title a:hover{color:var(--accent-strong)}
  .post-excerpt{font-size:16.5px;line-height:1.55;color:var(--text2);margin-top:8px;max-width:660px}

  /* article body */
  .post-body{max-width:680px;margin-top:26px;font-size:17.5px;line-height:1.7;color:var(--text)}
  .post-body h2{font-weight:600;font-size:24px;letter-spacing:-0.01em;color:var(--ink);margin:32px 0 10px}
  .post-body h3{font-weight:600;font-size:19px;color:var(--ink);margin:26px 0 8px}
  .post-body p{margin:0 0 16px}
  .post-body ul,.post-body ol{margin:0 0 16px 22px}
  .post-body li{margin:5px 0}
  .post-body a{color:var(--accent-strong);text-decoration:underline;text-underline-offset:2px}
  .post-body img{max-width:100%;height:auto;border-radius:8px}
  .post-body blockquote{margin:18px 0;padding-left:16px;border-left:3px solid var(--line);color:var(--text2)}
  .post-body code{font-family:var(--mono);font-size:0.9em;background:#f1ede3;padding:.12em .4em;border-radius:4px}
  .post-body pre{background:#f1ede3;padding:14px 16px;border-radius:8px;overflow:auto;margin:0 0 16px}
  .post-body pre code{background:none;padding:0}

  .pl-back{display:inline-block;margin-top:30px;font-family:var(--mono);font-size:13px;
    letter-spacing:0.04em;color:var(--accent-strong);text-decoration:none;text-transform:uppercase}
  .pl-back:hover{text-decoration:underline}

  /* footer — matches the site's mono tag style */
  .pl-foot{max-width:880px;margin:40px auto 0;padding:22px 40px 44px;border-top:1px solid var(--line);
    display:flex;gap:12px 26px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .pl-foot .tag{font-family:var(--mono);letter-spacing:0.04em;text-transform:uppercase}

  :focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
  @media (max-width:680px){
    .pl-nav{padding:14px 18px}
    .pl-wrap{padding:0 18px}
    .pl-foot{padding:22px 18px 38px}
    .pl-navlinks{gap:15px;font-size:14px}
    h1.pl-title{font-size:34px}
  }
</style>
</head>
<body>
  <div class="pl-nav">
    <a class="pl-brand" href="/index.html">SiyoungKimLab</a>
    <nav class="pl-navlinks">
      <a href="/index.html">Home</a>
      <a href="/research.html">Research</a>
      <a href="/team.html">Team</a>
      <a href="/publications.html">Publications</a>
      <a href="/blog.html" class="current">Blog</a>
      <a href="/contact.html">Contact</a>
    </nav>
  </div>

  <main>
    <div class="pl-wrap">
      {{ content }}
    </div>
  </main>

  <footer class="pl-foot">
    <span>© Copyright {{ site.time | date: '%Y' }} Siyoung Kim Lab</span>
    <span class="tag">Molecular AI for Therapeutics</span>
  </footer>
</body>
</html>
