  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:28px;font-size:15px;color:#6f6a5f\">\n      <a href=\"research.html\" style=\"text-decoration:none;color:#9a6a14;font-weight:500\">Research<\u002Fa>\n      <a href=\"team.html\" style=\"text-decoration:none\">Team<\u002Fa>\n      <a href=\"publications.html\" style=\"text-decoration:none\">Publications<\u002Fa>\n      <a href=\"contact.html\" style=\"text-decoration:none\">Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pl-wrap\" style=\"max-width:880px;margin:0 auto;padding:0 40px\">\n\n    <!-- HEADER -->\n    <div style=\"padding:60px 0 8px\">\n      <h1 class=\"pl-title\" style=\"font-weight:600;font-size:48px;line-height:1.05;letter-spacing:-0.025em;color:#1c1b19\">Research<\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.6;color:#5a564d;margin-top:18px;max-width:680px;font-weight:300\">We build and apply state-of-the-art AI and computational tools for structure-based drug discovery. Our program spans four core areas, from collaborative discovery campaigns to foundational method development.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- AREA 01 -->\n    <div style=\"padding:46px 0 0\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#b07a18;margin-bottom:10px\">01 · predict( hit → structure )<\u002Fdiv>\n      <h2 style=\"font-weight:600;font-size:27px;letter-spacing:-0.015em;color:#1c1b19;padding-bottom:14px;border-bottom:1px solid #e9e5da\">Collaborative Drug Discovery<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.68;color:#3a382f;margin-top:20px;font-weight:300\">Recent advances in experimental screening technologies have made it possible to evaluate large libraries of compounds against target proteins efficiently, accelerating the identification of hit molecules. However, determining the co-complex structure of a hit bound to its target through crystallography or cryo-EM remains time-consuming, resource-intensive, and technically challenging. <b style=\"font-weight:600;color:#1c1b19\">We bridge this gap by combining physics and AI to generate accurate computational models that enable structure-based drug design, critical for improving both potency and selectivity.<\u002Fb> These models reveal how a ligand engages its binding site at atomic resolution, exposing the specific interactions that drive affinity and the liabilities that undermine it. We also develop computational strategies to optimize initial hit molecules into safe and effective drug candidates, navigating the trade-offs among potency, selectivity, solubility, and metabolic stability that determine whether a chemical series can advance. By working hand in hand with experimental Purdue collaborators, we close the design–make–test–analyze loop more quickly, using each round of structural and assay data to sharpen the next set of predictions. Through these efforts, our lab supports collaborative drug discovery projects across the department and the broader university community.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- AREA 02 -->\n    <div style=\"padding:44px 0 0\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#b07a18;margin-bottom:10px\">02 · integrate( physics → AI )<\u002Fdiv>\n      <h2 style=\"font-weight:600;font-size:27px;letter-spacing:-0.015em;color:#1c1b19;padding-bottom:14px;border-bottom:1px solid #e9e5da\">Physics-Aware PurdueFold<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.68;color:#3a382f;margin-top:20px;font-weight:300\">Co-folding models like AlphaFold3 have revolutionized protein–ligand co-complex structure prediction, offering a rapid alternative to experimental structure determination. However, they perform well only for well-represented targets and pockets, such as the orthosteric pockets of kinases, and generalize poorly to novel chemotypes, allosteric sites, and underrepresented protein families. <b style=\"font-weight:600;color:#1c1b19\">To make a quantum leap in co-folding models, we develop PurdueFold, a physics-aware co-folding framework that embeds physical priors such as energetics, geometry, and interaction constraints directly into the learning process, making predictions more generalizable, accurate, and physically realistic.<\u002Fb> Additionally, to overcome the scarcity of experimental co-complex structures, we further expand training sets with augmented computational data drawn from molecular simulation and experimental measurement. By coupling the pattern-recognition strength of deep learning with the rigor of physical constraints and the breadth of virtual data generation, PurdueFold yields binding poses that are both confident and energetically sound. Through these efforts, our lab extends reliable structure prediction for novel targets and allosteric pockets beyond the boundaries of existing experimental datasets.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- AREA 03 -->\n    <div style=\"padding:44px 0 0\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#b07a18;margin-bottom:10px\">03 · simulate( pseudopeptide )<\u002Fdiv>\n      <h2 style=\"font-weight:600;font-size:27px;letter-spacing:-0.015em;color:#1c1b19;padding-bottom:14px;border-bottom:1px solid #e9e5da\">Pseudopeptide Modeling<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.68;color:#3a382f;margin-top:20px;font-weight:300\">Pseudopeptides occupy a Goldilocks niche between small molecules and biologics — large enough to engage flat, open, pharmacophore-poor protein surfaces, yet small enough to retain favorable, sometimes oral, drug-like properties. Several have become blockbusters, including semaglutide and tirzepatide (GLP-1 receptor agonists) and icotrokinra (an IL-23 receptor inhibitor). Despite their growing therapeutic importance, pseudopeptide modalities have received far less attention from computational chemistry than small molecules. <b style=\"font-weight:600;color:#1c1b19\">We address this gap by developing frameworks that accurately model pseudopeptide–protein interactions.<\u002Fb> In particular, we build dedicated force fields for non-natural residues and linkers, along with predictive tools that assess secondary-structure stability and binding propensity. Because these molecules can adopt diverse and often strained conformations, capturing their behavior demands physics that standard small molecule and protein force fields were never designed to handle. By combining tailored force fields with enhanced sampling simulations, we map the conformational ensembles that govern whether a pseudopeptide stays folded, engages its target, and resists proteolytic degradation. These efforts help guide the design of potent, selective, and conformationally stable peptide therapeutics that expand the reach of structure-based drug design beyond conventional small molecules.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- AREA 04 -->\n    <div style=\"padding:44px 0 0\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.06em;color:#b07a18;margin-bottom:10px\">04 · map( protein → cryptic pockets )<\u002Fdiv>\n      <h2 style=\"font-weight:600;font-size:27px;letter-spacing:-0.015em;color:#1c1b19;padding-bottom:14px;border-bottom:1px solid #e9e5da\">Multiscale Pocketome<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.68;color:#3a382f;margin-top:20px;font-weight:300\">Small-molecule drug discovery has historically focused on a limited set of well-characterized binding sites, including the orthosteric pockets of kinases, the ligand-binding pockets of G protein-coupled receptors (GPCRs), ion channels, and nuclear receptors. As a result, much of the proteome remains unexplored because the locations and properties of potential binding pockets are unknown. To address this challenge, we are developing a multiscale molecular dynamics workflow to systematically discover cryptic binding pockets and identify small molecules that can bind them. <b style=\"font-weight:600;color:#1c1b19\">Our approach combines the efficiency of coarse-grained molecular dynamics simulations with pharmacophore probing to rapidly explore protein conformational landscapes and reveal transient, previously hidden pockets.<\u002Fb> We then use statistically enriched pharmacophore information extracted from these simulations to guide docking and prioritize candidate binders. Through this effort, we aim to construct a comprehensive multiscale pocketome: a systematic map of previously undiscovered ligand-binding sites across the proteome. By expanding the repertoire of druggable pockets, this work seeks to transform proteins once considered undruggable into viable therapeutic targets and unlock opportunities within the roughly 85% of the human proteome that remains inaccessible to small-molecule drugs.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- FOOTER -->\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:60px;padding:24px 0 44px;border-top:1px solid #e9e5da;font-size:13px;color:#9a958a\">\n      <span style=\"font-family:'IBM Plex Sans',sans-serif\">© Copyright 2026 Siyoung Kim Lab<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em\">BUILD 0002<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em\">MOLECULAR AI FOR THERAPEUTICS<\u002Fspan>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
